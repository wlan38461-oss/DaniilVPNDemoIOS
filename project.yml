name: DaniilVPNDemo
options:
  bundleIdPrefix: com.example
targets:
  DaniilVPNDemo:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources: [Sources]
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.example.daniilvpndemo
      PRODUCT_NAME: DaniilVPNDemo
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_KEY_UILaunchScreen_Generation: YES
      INFOPLIST_KEY_CFBundleDisplayName: DaniilVPN Demo
      INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
      TARGETED_DEVICE_FAMILY: "1"
