name: Build IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build archive
        run: |
          xcodebuild archive \
            -project DaniilVPNDemo.xcodeproj \
            -scheme DaniilVPNDemo \
            -sdk iphoneos \
            -archivePath build/DaniilVPNDemo.xcarchive \
            CODE_SIGNING_ALLOWED=NO

      - name: Export unsigned IPA
        run: |
          mkdir -p build/ipa/Payload
          cp -r build/DaniilVPNDemo.xcarchive/Products/Applications/DaniilVPNDemo.app build/ipa/Payload/
          cd build/ipa
          zip -r DaniilVPNDemo.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: DaniilVPNDemo-ipa
          path: build/ipa/DaniilVPNDemo.ipa
